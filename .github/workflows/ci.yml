name: VeriWeave Govern CI

on:
  push:
    branches: [main, "agent/**", "publication/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Lint
        run: ruff check app benchmark research consulting tests
      - name: Test
        run: pytest -q

  research-smoke:
    name: GovernBench research smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run reproducible research smoke
        run: python -m research.experiments --seeds 2 --cases 180 --output results/research-smoke
      - name: Verify artifacts
        run: |
          test -s results/research-smoke/report.json
          test -s results/research-smoke/report.html
          test -s results/research-smoke/baseline-runs.csv
      - uses: actions/upload-artifact@v4
        with:
          name: governbench-research-smoke
          path: results/research-smoke/

  publication-smoke:
    name: EU Austria publication smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run legal audit and publication pipeline without external engines
        env:
          PUBLICATION_BOOTSTRAP_SAMPLES: "1000"
          PUBLICATION_BOOTSTRAP_SEED: "20260817"
        run: make publication-local
      - name: Verify publication artifacts and draft boundary
        run: |
          test -s results/publication/legal-audit.json
          test -s results/publication/report.json
          test -s results/publication/report.html
          test -s results/publication/predictions.csv
          test -s results/publication/statistics.json
          test -s results/publication/statistics.html
          test -s results/publication/calibration-reliability.svg
          test -s results/publication/annotator-a.csv
          test -s results/publication/annotator-b.csv
          test -s results/publication/adjudication.csv
          grep -q '"status": "pass"' results/publication/legal-audit.json
          grep -q '"label_status": "provisional-regulation-grounded"' results/publication/report.json
          grep -q '"label_status": "provisional-regulation-grounded"' results/publication/statistics.json
      - uses: actions/upload-artifact@v4
        with:
          name: publication-smoke
          path: results/publication/

  package:
    name: Package metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build<2" "twine<8"
          python -m build
          python -m twine check dist/*
      - name: Verify license artifacts
        run: |
          test -s LICENSE
          test -s NOTICE
          grep -q 'license = "Apache-2.0"' pyproject.toml
          grep -q 'org.opencontainers.image.licenses="Apache-2.0"' Dockerfile

  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Build application, benchmark and research image
        run: docker compose --profile benchmark --profile research build govern test research

  benchmark:
    name: Governance benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Run end-to-end governance benchmark
        env:
          BENCHMARK_ITERATIONS: "3"
          BENCHMARK_CONCURRENCY: "2"
        run: |
          mkdir -p results
          chmod 0777 results
          docker compose up --build --abort-on-container-exit --exit-code-from test test
      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veriweave-govern-benchmark
          path: results/
          if-no-files-found: warn
      - name: Stop benchmark services
        if: always()
        run: docker compose down --volumes --remove-orphans
