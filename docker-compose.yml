services:
  govern:
    build: .
    image: veriweave-govern:0.1.0
    ports:
      - "8080:8080"
    environment:
      GOVERN_AUDIT_PATH: /app/data/audit.jsonl
      GOVERN_AUDIT_SIGNING_KEY: ${GOVERN_AUDIT_SIGNING_KEY:-development-only-change-me}
    volumes:
      - govern-data:/app/data
      - ./config/policies:/app/config/policies:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  test:
    profiles:
      - benchmark
    build:
      context: .
      dockerfile: benchmark/Dockerfile
    image: veriweave-govern-benchmark:0.1.0
    depends_on:
      govern:
        condition: service_healthy
    environment:
      BENCHMARK_BASE_URL: http://govern:8080
      BENCHMARK_SCENARIOS: /workspace/benchmark/scenarios.json
      BENCHMARK_RESULTS_DIR: /results
      BENCHMARK_ITERATIONS: ${BENCHMARK_ITERATIONS:-10}
      BENCHMARK_CONCURRENCY: ${BENCHMARK_CONCURRENCY:-4}
      BENCHMARK_REQUEST_TIMEOUT: ${BENCHMARK_REQUEST_TIMEOUT:-10}
    user: "0:0"
    volumes:
      - ./results:/results:rw
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

volumes:
  govern-data:
