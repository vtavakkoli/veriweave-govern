services:
  govern:
    build: .
    image: veriweave-govern:0.4.0
    ports:
      - "8080:8080"
    environment:
      GOVERN_AUDIT_PATH: /app/data/audit.jsonl
      GOVERN_AUDIT_SIGNING_KEY: ${GOVERN_AUDIT_SIGNING_KEY:-development-only-change-me}
    volumes:
      - govern-data:/app/data
      - ./config/policies:/app/config/policies:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/health')
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  test:
    profiles: [benchmark]
    build:
      context: .
      dockerfile: benchmark/Dockerfile
    image: veriweave-govern-benchmark:0.4.0
    depends_on:
      govern:
        condition: service_healthy
    environment:
      BENCHMARK_BASE_URL: http://govern:8080
      BENCHMARK_SCENARIOS: /workspace/benchmark/scenarios.json
      BENCHMARK_RESULTS_DIR: /results
      BENCHMARK_ITERATIONS: ${BENCHMARK_ITERATIONS:-10}
      BENCHMARK_CONCURRENCY: ${BENCHMARK_CONCURRENCY:-4}
      BENCHMARK_REQUEST_TIMEOUT: ${BENCHMARK_REQUEST_TIMEOUT:-10}
    user: "0:0"
    volumes: ["./results:/results:rw"]
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: "no"

  research:
    profiles: [research]
    build: .
    image: veriweave-govern:0.4.0
    command:
      - python
      - -m
      - research.experiments
      - --seeds
      - ${GOVERNBENCH_SEEDS:-30}
      - --cases
      - ${GOVERNBENCH_CASES:-2000}
      - --output
      - /app/results/research-v1
    user: "0:0"
    volumes: ["./results:/app/results:rw"]
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: "no"

  opa:
    profiles: [publication]
    image: openpolicyagent/opa:1.17.0
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - /policies
    volumes:
      - ./research/policy_baselines/opa:/policies:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: "no"

  publication:
    profiles: [publication]
    build:
      context: .
      dockerfile: research/Dockerfile.publication
    image: veriweave-govern-publication:0.4.0
    depends_on:
      - opa
    environment:
      OPA_URL: http://opa:8181
      CEDAR_BIN: cedar
      CEDAR_POLICY_DIR: research/policy_baselines/cedar
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3n:e2b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --opa
      - --cedar
      - --ollama
      - --require-external
      - --output
      - /app/results/publication
    user: "0:0"
    volumes: ["./results:/app/results:rw"]
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: "no"

  load-matrix:
    profiles: [publication]
    build:
      context: .
      dockerfile: benchmark/Dockerfile
    image: veriweave-govern-benchmark:0.4.0
    entrypoint: ["python", "-m", "benchmark.load_matrix"]
    depends_on:
      govern:
        condition: service_healthy
    environment:
      BENCHMARK_BASE_URL: http://govern:8080
      BENCHMARK_SCENARIOS: /workspace/benchmark/scenarios.json
      BENCHMARK_RESULTS_DIR: /results
      BENCHMARK_REQUEST_TIMEOUT: ${BENCHMARK_REQUEST_TIMEOUT:-10}
      LOAD_MATRIX_REQUESTS_PER_LEVEL: ${LOAD_MATRIX_REQUESTS_PER_LEVEL:-10000}
      LOAD_MATRIX_CONCURRENCIES: ${LOAD_MATRIX_CONCURRENCIES:-1,4,16,32}
    user: "0:0"
    volumes: ["./results:/results:rw"]
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: "no"

volumes:
  govern-data:
